<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a;
      --line: #e3e6eb; --accent: #2d5bff; --accent-text: #ffffff; --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --card: #1a1f25; --text: #e9edf2; --muted: #9aa5b1;
              --line: #2b323b; --accent: #6b8cff; --accent-text: #0b0e12; --error: #ff7b7b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    h2 { font-size: 15px; margin: 20px 0 10px; }
    .days, .times { display: flex; flex-wrap: wrap; gap: 8px; }
    button.chip { border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    button.chip:hover { border-color: var(--accent); }
    button.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    label { display: block; font-size: 14px; margin: 14px 0 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
            background: transparent; color: var(--text); font: inherit; }
    .primary { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
               background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    .primary:disabled { opacity: .5; cursor: default; }
    .msg { color: var(--muted); font-size: 14px; }
    .err { color: var(--error); font-size: 14px; margin-top: 12px; }
    .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 14px; }
    .consent input { width: auto; margin-top: 3px; }
    .hidden { display: none; }
    .done h1 { margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" id="booking">
    <h1>Schedule your <?= cfg.title.toLowerCase() ?> with <?= cfg.company ?></h1>
    <p class="sub"><?= cfg.intro ?> Each session is <?= cfg.minutes ?> minutes on Zoom. Times are shown in <span id="tz"></span>.</p>

    <div id="loading" class="msg">Loading available times…</div>
    <div id="none" class="msg hidden">There are no open times right now. Please check back soon.</div>

    <div id="picker" class="hidden">
      <h2>Pick a day</h2>
      <div class="days" id="days"></div>
      <h2 id="timesLabel" class="hidden">Pick a time</h2>
      <div class="times" id="times"></div>

      <form id="form" class="hidden" autocomplete="on">
        <h2>Your details</h2>
        <label for="name">Full name</label>
        <input id="name" name="name" required maxlength="100" autocomplete="name">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <? if (cfg.requireConsent) { ?>
        <label class="consent"><input id="consent" type="checkbox" required> <span><?= cfg.consentText ?></span></label>
        <? } ?>
        <button class="primary" id="submit" type="submit"><?= cfg.buttonLabel ?></button>
      </form>
    </div>
    <div id="error" class="err hidden"></div>
  </div>

  <div class="card done hidden" id="done">
    <h1><?= cfg.confirmTitle ?></h1>
    <p id="doneWhen"></p>
    <p class="msg"><?= cfg.confirmText ?></p>
  </div>
</div>

<script>
  const BUTTON_LABEL = <?!= JSON.stringify(cfg.buttonLabel).replace(/</g, '\\u003c') ?>;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('tz').textContent = tz.replace(/_/g, ' ');
  const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  const fullFmt = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  const dayKey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();

  let byDay = {}, selectedDay = null, selectedSlot = null;
  const $ = id => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hidden', !on);

  function showError(msg) { $('error').textContent = msg; show('error', !!msg); }

  function load() {
    show('loading', true); show('picker', false); show('none', false);
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(e => { show('loading', false); showError(e.message || 'Could not load times.'); })
      .getAvailableSlots();
  }

  function render(slots) {
    show('loading', false);
    byDay = {};
    slots.forEach(iso => {
      const d = new Date(iso), k = dayKey(d);
      (byDay[k] = byDay[k] || { date: d, slots: [] }).slots.push(iso);
    });
    const keys = Object.keys(byDay);
    if (!keys.length) { show('none', true); return; }
    show('picker', true);
    $('days').innerHTML = '';
    keys.forEach(k => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = dayFmt.format(byDay[k].date);
      b.onclick = () => pickDay(k, b);
      $('days').appendChild(b);
    });
    selectedDay = selectedSlot = null;
    $('times').innerHTML = ''; show('timesLabel', false); show('form', false);
  }

  function pickDay(k, btn) {
    selectedDay = k; selectedSlot = null; show('form', false); showError('');
    document.querySelectorAll('#days .chip').forEach(c => c.classList.toggle('on', c === btn));
    show('timesLabel', true);
    $('times').innerHTML = '';
    byDay[k].slots.forEach(iso => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = timeFmt.format(new Date(iso));
      b.onclick = () => {
        selectedSlot = iso;
        document.querySelectorAll('#times .chip').forEach(c => c.classList.toggle('on', c === b));
        show('form', true); $('name').focus();
      };
      $('times').appendChild(b);
    });
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    if (!selectedSlot) return;
    showError('');
    $('submit').disabled = true; $('submit').textContent = 'Booking…';
    google.script.run
      .withSuccessHandler(res => {
        $('doneWhen').textContent = fullFmt.format(new Date(res.start)) + ' · ' + res.minutes + ' minutes';
        show('booking', false); show('done', true);
      })
      .withFailureHandler(err => {
        $('submit').disabled = false; $('submit').textContent = BUTTON_LABEL;
        const msg = (err && err.message) || 'Something went wrong. Please try again.';
        showError(msg);
        if (/taken|too soon/i.test(msg)) load();
      })
      .bookSlot(selectedSlot, $('name').value, $('email').value, tz,
        $('consent') ? $('consent').checked : true);
  });

  load();
</script>
</body>
</html>
